{{- include "openbtp.validate" . -}}
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
  annotations:
    {{- include "openbtp.releaseAnnotations" . | nindent 4 }}
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # No hostname on this listener. The live Gateway was programmed this way
      # and HTTP-01 routes attach to it. The public host is on the HTTPRoute.
      allowedRoutes:
        namespaces:
          from: Same
    {{- if and .Values.gateway.tls.enabled .Values.gateway.tls.httpsListener }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "openbtp.fullname" . }}-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openbtp.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
  annotations:
    {{- include "openbtp.releaseAnnotations" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    {{- if and .Values.gateway.tls.enabled .Values.gateway.tls.redirect }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    {{- else }}
    - backendRefs:
        - name: {{ include "openbtp.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- if and .Values.gateway.tls.enabled .Values.gateway.tls.httpsListener }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openbtp.fullname" . }}-https
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
  annotations:
    {{- include "openbtp.releaseAnnotations" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "openbtp.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
{{- if .Values.gateway.tls.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "openbtp.fullname" . }}-acme
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
  annotations:
    {{- include "openbtp.releaseAnnotations" . | nindent 4 }}
spec:
  acme:
    {{- if .Values.gateway.tls.email }}
    email: {{ .Values.gateway.tls.email | quote }}
    {{- end }}
    server: {{ .Values.gateway.tls.acmeServer | quote }}
    privateKeySecretRef:
      name: {{ include "openbtp.fullname" . }}-acme-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ .Values.gateway.name }}
                namespace: {{ .Release.Namespace }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "openbtp.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
  annotations:
    {{- include "openbtp.releaseAnnotations" . | nindent 4 }}
spec:
  secretName: {{ include "openbtp.fullname" . }}-tls
  issuerRef:
    name: {{ include "openbtp.fullname" . }}-acme
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.gateway.host | quote }}
{{- end }}
{{- end }}
