{{- include "openbtp.validate" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openbtp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openbtp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
