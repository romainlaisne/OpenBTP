{{- include "openbtp.validate" . -}}
{{- if and .Values.serviceAccount.create .Values.app.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openbtp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbtp.labels" . | nindent 4 }}
  annotations:
    {{- include "openbtp.releaseAnnotations" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
