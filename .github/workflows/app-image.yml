name: app-image

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/openbtp-helm-cl01-1238
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - prisma/**
      - public/**
      - scripts/**
      - src/**
      - templates/**
      - .dockerignore

permissions:
  contents: read
  packages: write

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/romainlaisne/openbtp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=

      - name: Record digest
        run: |
          echo "image=ghcr.io/romainlaisne/openbtp@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=ghcr.io/romainlaisne/openbtp:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.push.outputs.digest }}"
